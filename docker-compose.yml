services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://rag_user:rag_password@postgres:5432/rag_db

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}

      LEXICAL_BACKEND: ${LEXICAL_BACKEND:-postgres_fts}

      BASE_DATA_DIRECTORY: /app/data
      UPLOAD_DIRECTORY: /app/data/uploads
      CHROMA_DIRECTORY: /app/data/chroma

    volumes:
      - app_uploads:/app/data/uploads
      - app_chroma:/app/data/chroma

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U rag_user -d rag_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  app_uploads:
  app_chroma:

